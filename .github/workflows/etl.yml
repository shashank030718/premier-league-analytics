
name: Premier League ETL CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 14 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline
        run: python src/main.py

      - name: Configure AWS credentials using OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        if: github.event_name != 'pull_request'
        run: aws sts get-caller-identity

      - name: Upload CSV to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 cp data/premier_league.csv \
            s3://premier-league-analytics-mps/processed/premier_league.csv

      - name: Upload Parquet to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 cp data/premier_league.parquet \
            s3://premier-league-analytics-mps/processed/parquet/premier_league.parquet

  notify:
    needs: run-etl
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Send SNS email notification
        env:
          ETL_STATUS: ${{ needs.run-etl.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          aws sns publish \
            --topic-arn "arn:aws:sns:ap-south-1:621788589162:premier-league-etl-notifications" \
            --subject "PL ETL TEST - ${ETL_STATUS}" \
            --message "Premier League Analytics ETL has finished.

          Result: ${ETL_STATUS}
          Trigger: ${TRIGGER}
          Workflow run: ${RUN_URL}"
