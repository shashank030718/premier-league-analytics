
name: Premier League ETL CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline
        run: python src/main.py

      - name: Configure AWS credentials using OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        if: github.event_name != 'pull_request'
        run: aws sts get-caller-identity

      - name: Upload CSV to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 cp data/premier_league.csv \
            s3://premier-league-analytics-mps/processed/premier_league.csv

      - name: Upload Parquet to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 cp data/premier_league.parquet \
            s3://premier-league-analytics-mps/processed/parquet/premier_league.parquet
